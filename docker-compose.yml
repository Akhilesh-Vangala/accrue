# Local SQL Server for development and integration tests.
# Apple Silicon: SQL Server only ships amd64 images, so enable Rosetta in Docker Desktop or run colima with --vm-type vz --vz-rosetta.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: accrue-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${ACCRUE_SA_PASSWORD:-Accrue!Dev2026}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - accrue-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  accrue-sql:
